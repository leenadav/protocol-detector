# Local SSDLC hooks mirroring the CI gates. Install: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (correctness + security rules)
        entry: ruff check
        language: system
        types: [python]
      - id: unittest
        name: unit tests
        entry: python3 -B -m unittest discover -q
        language: system
        pass_filenames: false
      - id: action-pins
        name: GitHub Actions pinned to commit SHAs
        entry: python3 -B tools/check_action_pins.py .github/workflows
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
      - id: workflow-policy
        name: ci gate lists every job, drift gate triggers on every workflow, release provenance
        entry: python3 -B tools/check_workflow_policy.py
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/|tools/check_workflow_policy\.py|tools/check_release_ref\.py|tools/check_release_exposure\.py|tools/check_release_checks\.py)
      - id: security-requirements
        name: security requirements reference existing tests
        entry: python3 -B tools/check_security_requirements.py
        language: system
        pass_filenames: false
      - id: policy-lint
        name: example policy lints strictly
        entry: python3 -B protodetect.py policy lint policy-example.json --strict
        language: system
        pass_filenames: false
        files: ^(policy-example\.json|protocol_engine/|protodetect\.py)
      - id: coverage-matrix
        name: direction coverage matrix in PROTOCOLS.md matches the fixtures
        entry: python3 -B tools/coverage_matrix.py --check PROTOCOLS.md
        language: system
        pass_filenames: false
      - id: docs-counts
        name: README/REVIEW-SCOPE numbers match the tree
        entry: python3 -B tools/check_docs_counts.py
        language: system
        pass_filenames: false
      - id: zizmor
        name: workflow security audit (zizmor, dev toolchain)
        entry: zizmor --no-online-audits --no-progress --persona pedantic --min-severity unknown .github/workflows
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
