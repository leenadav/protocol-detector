# Continuous integration with an SSDLC gate at every stage. See SSDLC.md.
# Actions are pinned to full commit SHAs; the workflow token is read-only.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly re-run catches toolchain drift and new advisories on an unchanged tree
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every module (syntax gate, no runtime dependencies allowed)
        run: |
          python -m compileall -q protocol_engine tools ./*.py
          grep -q '^dependencies = \[\]' pyproject.toml || (echo "runtime dependencies are not allowed" && exit 1)
      - name: Unit, fuzz and property tests
        run: |
          python -B -m unittest discover -q 2> test-output.txt || (cat test-output.txt && exit 1)
          tail -n 3 test-output.txt
          {
            echo "### Tests (python ${{ matrix.python }})"
            echo
            echo '```'
            tail -n 3 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Documentation numbers must match the tree (families, applications, tests, version)
        run: python -B tools/check_docs_counts.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Offline replay of synthetic captures
        run: |
          python -B analyze_pcap.py sample-expanded.pcap --events-only --sessions > /dev/null
          python -B live_capture.py --stdin --duration 0 --json < sample-expanded.pcap > /dev/null
          python -B protocol_demo.py --json > /dev/null
          python -B appid_catalog.py --json > /dev/null
          python -B protodetect.py version
          python -B protodetect.py policy lint policy-example.json --strict
          python -B protodetect.py signatures lint signatures-example.json
          python -B protodetect.py analyze sample-expanded.pcap --policy policy-example.json --json --events-only > /dev/null
          python -B protodetect.py analyze sample-expanded.pcap --json --sessions > rows.jsonl
          python -B protodetect.py schema offline-row --validate rows.jsonl
          python -B tools/coverage_matrix.py --check PROTOCOLS.md

  behaviour-diff:
    name: behaviour diff against the previous commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          # On a pull request the default checkout is the synthetic merge commit, whose parent is the
          # base branch; the diff must compare the pushed head with its own parent instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Compare every fixture, truncation and seeded mutation with the parent commit
        env:
          SEED: ${{ github.run_id }}
        run: |
          if git rev-parse --verify -q HEAD~1 >/dev/null && git cat-file -e HEAD~1:protocol_engine/engine.py 2>/dev/null; then
            git worktree add --detach ../baseline HEAD~1
            python -B tools/compare_engine.py ../baseline --iterations 300 --seed "$SEED" --report behaviour-diff.md --report-only
          else
            printf '# Engine behaviour diff\n\nNo comparable parent commit (first commit or a parent without the engine).\n' > behaviour-diff.md
          fi
          head -60 behaviour-diff.md
          {
            echo "### Behaviour diff against the parent commit"
            echo
            head -40 behaviour-diff.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the pull request base (the first checkout drops its credentials, so git fetch cannot)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          path: pr-base
      - name: Compare with the pull request base as well (whole change, when the base carries the engine)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SEED: ${{ github.run_id }}
        run: |
          if [ -f pr-base/protocol_engine/engine.py ]; then
            python -B tools/compare_engine.py pr-base --iterations 300 --seed "$SEED" --report behaviour-diff-base.md --report-only
          else
            printf '# Engine behaviour diff\n\nThe pull request base %s has no engine to compare with.\n' "$BASE_SHA" > behaviour-diff-base.md
          fi
          head -60 behaviour-diff-base.md
          {
            echo "### Behaviour diff against the pull request base"
            echo
            head -40 behaviour-diff-base.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the pull request base diff report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: behaviour-diff-base-${{ github.sha }}
          path: behaviour-diff-base.md
          retention-days: 30
      - name: Upload the behaviour diff report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: behaviour-diff-${{ github.sha }}
          path: behaviour-diff.md
          retention-days: 30

  static-analysis:
    name: static analysis (ruff, bandit, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the pull request's commits on pull_request events
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned analysis tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Ruff (errors, bugbear, security rules)
        run: ruff check --output-format github .
      - name: Bandit (Python security linter)
        run: bandit -c bandit.yaml -r protocol_engine analyze_pcap.py live_capture.py sessions.py packets.py link_packets.py capture_stream.py -f txt
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  supply-chain:
    name: supply chain (SBOM, licence, pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Every action must be pinned to a commit SHA
        run: python -B tools/check_action_pins.py .github/workflows
      - name: Generate CycloneDX SBOM for the package (zero runtime dependencies expected)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          cyclonedx-py environment --output-format json --output-file sbom.cdx.json
          python -B tools/sbom_summary.py sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

  package:
    name: package build (sdist, wheel, clean install)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel with the hash-pinned toolchain
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m build --sdist --wheel --outdir dist
      - name: The wheel holds exactly the engine package and declares no runtime dependency
        run: python -B tools/check_wheel.py "dist/*.whl" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the wheel into an empty environment and classify a fixture from it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --no-deps --no-index dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python - <<'PY'
          from protocol_engine import Inspector, DatagramInspector, supported_protocols
          inspector = Inspector()
          inspector.feed(b"GET / HTTP/1.1\r\nHost: example.com\r\n\r\n")
          assert inspector.observation.application_protocol == "http/1.1", inspector.observation
          dns = DatagramInspector().inspect(bytes.fromhex("123401000001000000000000") + b"\x03www\x07example\x03com\x00\x00\x01\x00\x01")
          assert dns.application_protocol == "dns", dns
          print("installed wheel classifies; families:", len(list(supported_protocols())))
          PY
      - name: Upload the distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  workflow-lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch actionlint 1.7.7 and verify its published checksum
        env:
          VERSION: "1.7.7"
          SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: Lint every workflow (syntax, expressions, shellcheck-style script checks)
        run: ./actionlint -no-color .github/workflows/*.yml

  toolchain-audit:
    name: known vulnerabilities in the dev toolchain (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the hash-pinned toolchain (pip-audit included)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Audit every pinned development dependency against the advisory databases
        run: pip-audit -r requirements-dev.txt --require-hashes --strict --progress-spinner off --desc on | tee -a "$GITHUB_STEP_SUMMARY"

  security-requirements:
    name: security requirements gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Documented security requirements must have an executable check
        run: python -B tools/check_security_requirements.py
