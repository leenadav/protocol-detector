# Continuous integration with an SSDLC gate at every stage. See SSDLC.md.
# Actions are pinned to full commit SHAs; the workflow token is read-only.
name: ci

on:
  # One run per change (PRO-202): a push to a branch with an open pull request used to start a push run and a
  # pull_request run on the same commit (different refs, so different concurrency groups). Branches now run on
  # their pull request; main on push; a branch without a pull request by workflow_dispatch on its ref.
  push:
    branches: ["main"]
  pull_request:
    # labeled/unlabeled: the go-api job reads the `api-break` label from the event, and a re-run keeps the
    # labels of its original event, so a label change starts a run of its own
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 3 * * 1"   # weekly re-run catches toolchain drift and new advisories on an unchanged tree
  workflow_dispatch:

permissions:
  contents: read

# A pull request or dispatched run cancels its superseded run on the same ref. A push to main gets a group of its
# own commit, so no main run is ever cancelled or dropped while queued: every main commit keeps its own gate
# result, which the release checks read for a tagged commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Explicit bash runs `bash --noprofile --norc -eo pipefail`; the unspecified default is
# `bash -e` without pipefail, under which a failing check piped into tee passes the step.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the Go binary the launcher tests run (make go-build, offline and vendored; nothing to build without the target)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py build --summary "$GITHUB_STEP_SUMMARY"
      - name: Compile every module (syntax gate, no runtime dependencies allowed)
        run: |
          python -m compileall -q tools migration presentation ./*.py
          grep -q '^dependencies = \[\]' pyproject.toml || (echo "runtime dependencies are not allowed" && exit 1)
      - name: Repository tooling and launcher tests (the Python reference engine is removed, PRO-403)
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          python -B -m unittest discover -q 2> test-output.txt || (cat test-output.txt && exit 1)
          tail -n 3 test-output.txt
          {
            echo "### Tests (python $PYTHON_VERSION)"
            echo
            echo '```'
            tail -n 3 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Documentation numbers must match the tree (families, applications, tests, version)
        run: python -B tools/check_docs_counts.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Product integrity (build manifest, key logs, content lock)
        run: |
          python -B tools/build_manifest.py --check presentation/SOURCE.json | tee -a "$GITHUB_STEP_SUMMARY"
          python -B tools/check_no_keylogs.py | tee -a "$GITHUB_STEP_SUMMARY"
          python -B tools/check_content.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Presentation suite (Node and browser tests are required in presentation-ui)
        # `unittest` passes a skipped test, so the strict runner fails on any skip but the two UI tests named
        # here, which the presentation-ui job runs with Node and Playwright and allows no skip at all.
        run: |
          python -B tools/run_tests_strict.py --self-test
          python -B tools/run_tests_strict.py --cwd presentation --start tests --summary "$GITHUB_STEP_SUMMARY" --allow-skip test_ui.StoreUnitTests.test_store_reducer_and_selectors --allow-skip test_ui.GoServiceBrowserTests.test_dashboard_in_a_real_browser_on_the_go_service
      - name: Offline replay of synthetic captures through the launcher and the Go binary
        run: |
          python -B protodetect.py version
          python -B protodetect.py analyze sample-expanded.pcap --policy policy-example.json --json --events-only > /dev/null
          python -B protodetect.py analyze sample-expanded.pcap --json --sessions > rows.jsonl
          python -B protodetect.py schema offline-row --validate rows.jsonl

  presentation-ui:
    # The presentation suite with every prerequisite installed explicitly: Node and the lock-pinned
    # Playwright with its Chromium. No test may skip, so a missing prerequisite fails the job instead of
    # reading as a pass. PRO-403: the page is served by the Go binary; there is no wheel to install.
    name: presentation with Node and a real browser (no test may skip)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the Go binary the launcher tests run (make go-build, offline and vendored; nothing to build without the target)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py build --summary "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright with Chromium from the lock
        run: |
          npm ci --prefix tools/ui-test-deps --ignore-scripts --no-audit --no-fund
          tools/ui-test-deps/node_modules/.bin/playwright install --with-deps chromium
          node --version | tee -a "$GITHUB_STEP_SUMMARY"
          tools/ui-test-deps/node_modules/.bin/playwright --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Presentation suite from the checkout, every test required (store unit tests in Node, the dashboard in Chromium)
        env:
          NODE_PATH: ${{ github.workspace }}/tools/ui-test-deps/node_modules
        run: python -B tools/run_tests_strict.py --cwd presentation --start tests --summary "$GITHUB_STEP_SUMMARY"

  static-analysis:
    name: static analysis (ruff, bandit, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned analysis tools
        run: python -I -m pip install --require-hashes -r requirements-dev.txt
      - name: Ruff (errors, bugbear, security rules)
        run: |
          ruff check --output-format github .
          echo "ruff: no findings ($(ruff --version))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bandit (Python security linter)
        run: |
          bandit -c bandit.yaml -r protodetect.py main.py -f txt | tee bandit.txt
          {
            echo
            echo '```'
            grep -A 12 '^Run metrics:' bandit.txt || tail -n 15 bandit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Go for the pinned scanner builds
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Secret scan (gitleaks 8.30.1, full history, inline allows ignored)
        # tools/scanners/go.mod and go.sum pin gitleaks and every dependency (checked against the Go
        # checksum database; rule 16 locks go.mod). Only those two files are copied to RUNNER_TEMP and
        # built there, read-only. --ignore-gitleaks-allow makes gitleaks itself ignore inline allow
        # comments in every commit it scans (item 21); .gitleaks.toml (rule 16) is the only allowlist.
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/scanners"
          cp tools/scanners/go.mod tools/scanners/go.sum "$RUNNER_TEMP/scanners/"
          cd "$RUNNER_TEMP/scanners"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/bin/gitleaks" git --ignore-gitleaks-allow --redact --no-banner --exit-code 1 . 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The gitleaks allowlists stay narrow (tools/check_gitleaks_allowlist.py, the pinned gitleaks)
        # After the scan, so no repository code runs before the scanner (rule 15). A CNAME chain is allowed only in
        # research/live-results-*.tsv, and keys, tokens and the same chain elsewhere must still be reported.
        run: |
          python -B tools/check_gitleaks_allowlist.py --self-test
          python -B tools/check_gitleaks_allowlist.py --bin "$RUNNER_TEMP/bin" | tee -a "$GITHUB_STEP_SUMMARY"

  supply-chain:
    name: supply chain (SBOM, licence, pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Every action must be pinned to a commit SHA
        run: python -B tools/check_action_pins.py .github/workflows
      - name: Generate CycloneDX SBOM for the package (zero runtime dependencies expected)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          cyclonedx-py environment --output-format json --output-file sbom.cdx.json
          python -B tools/sbom_summary.py sbom.cdx.json | tee sbom-summary.txt
          {
            echo "### SBOM"
            echo
            head -n 1 sbom-summary.txt
            echo "pyproject.toml declares no runtime dependency (checked by tools/sbom_summary.py)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

  workflow-lint:
    name: workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # rule 16 searches every commit gitleaks scans, back to its baseline
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Fetch actionlint 1.7.7 and verify its published checksum
        env:
          VERSION: "1.7.7"
          SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: Lint every workflow (syntax, expressions, shellcheck-style script checks)
        run: |
          ./actionlint -no-color .github/workflows/*.yml
          echo "actionlint: $(find .github/workflows -name '*.yml' | wc -l) workflow files clean" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit every workflow for security weaknesses (zizmor, pedantic persona, offline audits)
        # Template injection, credential persistence, cache poisoning, excessive or undocumented
        # permissions, unpinned or superfluous actions, missing concurrency limits. Any finding fails.
        # It runs before any repository code in this job (tools/check_workflow_policy.py rule 15),
        # so no repository script can shadow it through the runner's per-step path file.
        run: |
          python -I -m pip install --require-hashes -r requirements-dev.txt > /dev/null
          zizmor --no-online-audits --no-progress --persona pedantic --min-severity unknown .github/workflows | tee zizmor.txt
          echo "zizmor $(zizmor --version | awk '{print $NF}'): $(tail -n 1 zizmor.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Workflow policy (gate covers every ci job, drift gate triggers on every workflow, releases serialize, tags must be on main)
        run: |
          python -B .claude/hooks/guard.py --self-test
          python -B tools/check_release_ref.py --self-test
          python -B tools/check_release_exposure.py --self-test
          python -B tools/check_release_checks.py --self-test
          python -B tools/release_audit.py --self-test
          python -B tools/check_go_drift.py --self-test
          python -B tools/codeql_gate.py --self-test
          python -B tools/ci_scope.py --self-test
          python -B tools/go_ci.py --self-test
          python -B tools/go_fuzz_long.py --self-test
          python -B tools/go_fuzz_smoke.py --self-test
          python -B tools/go_fuzz_smoke.py --check-matrix .github/workflows/ci.yml
          python -B tools/content_gate.py --self-test
          python -B tools/merge_readiness.py --self-test
          python -B tools/perf_history.py --self-test
          python -B tools/build_go_release.py --self-test
          python -B tools/release_provenance.py --self-test
          python -B tools/check_release_exposure.py --ref HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python -B tools/check_required_checks.py --self-test
          python -B tools/check_required_checks.py
          python -B tools/check_ci_consistency.py --self-test
          python -B tools/check_ci_consistency.py
          python -B tools/check_workflow_policy.py --self-test
          python -B tools/check_workflow_policy.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cross-check the workflow policy parser against PyYAML (any disagreement is a policy blind spot)
        # tools/check_workflow_policy.py rule 11 pins this step (it installs its own hash-pinned toolchain).
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt > /dev/null
          python -B tools/check_workflow_yaml.py --self-test
          python -B tools/check_workflow_yaml.py | tee -a "$GITHUB_STEP_SUMMARY"

  toolchain-audit:
    name: known vulnerabilities in the dev toolchain (pip-audit, govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the hash-pinned toolchain (pip-audit included)
        run: python -I -m pip install --require-hashes -r requirements-dev.txt
      - name: Audit every pinned development dependency against the advisory databases
        run: pip-audit -r requirements-dev.txt --require-hashes --strict --progress-spinner off --desc on | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Go for the pinned scanner builds
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Audit the Go-built scanners against the Go vulnerability database (govulncheck)
        # The same pinned build as the secret scan (tools/scanners), checked symbol by symbol: any known
        # vulnerability reachable in gitleaks or govulncheck, in a dependency or the Go standard library
        # it was built with, fails the job (item 22).
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/scanners"
          cp tools/scanners/go.mod tools/scanners/go.sum "$RUNNER_TEMP/scanners/"
          cd "$RUNNER_TEMP/scanners"
          GOBIN="$RUNNER_TEMP/bin" go install tool
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/bin/govulncheck" -mode=binary "$RUNNER_TEMP/bin/gitleaks" | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/bin/govulncheck" -mode=binary "$RUNNER_TEMP/bin/govulncheck" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit the Go engine module against the Go vulnerability database (govulncheck, vendored source)
        # Ported from the engine lane's 34ea6b0 (claude/go-migration), so ci.yml keeps one writer. Source mode
        # follows the call graph of every package in go/, on exactly the committed vendor tree
        # (GOFLAGS=-mod=vendor; with no dependency, as on main today, the module alone): a known
        # vulnerability reachable in a dependency or in the pinned standard library fails the job. Modules
        # are never fetched (GOPROXY=off); govulncheck reads only its vulnerability database (vuln.go.dev).
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=vendor"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        working-directory: go
        run: |
          "$RUNNER_TEMP/bin/govulncheck" ./... | tee -a "$GITHUB_STEP_SUMMARY"

  osv-scan:
    # Known vulnerabilities in every committed lockfile (Python requirements, npm, the engine's go.mod and every CI
    # tool module) from the OSV database: osv-scanner 2.7.1, built from tools/golint/osv-scanner/go.mod and go.sum
    # (every module hash checked against the Go checksum database) in a copy outside the checkout before any
    # repository code runs. A finding fails unless tools/osv_ignore.json accepts it for that lockfile and package,
    # with a reason and an expiry; an expired or stale entry fails too (tools/osv_scan.py, item 41). govulncheck
    # (toolchain-audit) stays the reachability check for Go.
    name: Known vulnerabilities in every lockfile (osv-scanner; accepted only with a reason and an expiry)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the pinned osv-scanner (tools/golint/osv-scanner)
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/golint"
          cp -r tools/golint/osv-scanner "$RUNNER_TEMP/golint/"
          cd "$RUNNER_TEMP/golint/osv-scanner"
          GOBIN="$RUNNER_TEMP/bin" go install tool
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Scan every lockfile against the OSV database (tools/osv_scan.py)
        run: |
          python -B tools/osv_scan.py --self-test
          python -B tools/osv_scan.py --bin "$RUNNER_TEMP/bin" --summary "$GITHUB_STEP_SUMMARY"

  go-engine:
    # Migration M10: the Go engine's own gate on GitHub's runners, on the one Go toolchain the scanner
    # builds use (tools/check_go_drift.py keeps it the newest patch of a supported line; tools/go_ci.py
    # refuses a go/go.mod that builds with another: its `toolchain` line, else its `go` line). `make
    # go-check` runs in three jobs (PRO-202): this one (`make go-check-static`: gofmt, go vet, the mutation
    # boundary checks; then `make go-check-race`: go test -race; then `make go-check-386`: the protocol
    # parsers' tests on GOARCH=386, where 32-bit int wraps such as SEC-X509-1 show; PRO-262), go-fuzz-smoke (`make go-check-fuzz`, one
    # shard per matrix job) and go-parity (`make go-check-parity`). Each part is the same Makefile target
    # `make go-check` runs locally, so the three jobs check exactly what one did. A commit without the
    # migration tree has nothing to check and says so in the summary; one with part of it fails.
    # Docs-only fast path (PRO-202 step 3): this job, go-fuzz-smoke, go-parity, go-minimum and go-determinism
    # pass --docs-only-fast-path and check out both parents of the merge commit; on a pull request whose every
    # changed path is Markdown or research data (tools/ci_scope.py) they check the tree and toolchain, skip
    # the make target and list the paths, so the job and the gate still report success. A push to main,
    # the schedule, a dispatch or any doubt runs everything. No job-level `if:` (rule 13).
    # GOPROXY=off: the engine's dependency is vendored, so a target asking for any other Go or module
    # fails instead of downloading it mid-job.
    name: Go engine (gofmt, vet, race tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # both parents of the pull request merge commit (tools/ci_scope.py)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: gofmt, go vet and the mutation boundary checks (make go-check-static)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py go --part static --docs-only-fast-path --summary "$GITHUB_STEP_SUMMARY"
      - name: Race tests (make go-check-race)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py go --part race --docs-only-fast-path --summary "$GITHUB_STEP_SUMMARY"
      - name: 32-bit protocol tests (make go-check-386)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py go --part 386 --docs-only-fast-path --summary "$GITHUB_STEP_SUMMARY"

  go-fuzz-smoke:
    # The fuzz smoke of `make go-check`: every GO_FUZZ_SMOKE target in the Makefile for its seconds, split
    # into shards by tools/go_fuzz_smoke.py (longest first to the least-loaded shard, fixed, so the shards
    # are disjoint and together run every target). The matrix must list every shard "1/N" .. "N/N":
    # `tools/go_fuzz_smoke.py --check-matrix` (workflow-lint job, make workflow-policy) fails otherwise.
    # The shard reaches the tool through the environment, never expanded into the script.
    name: Go fuzz smoke (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # both parents of the pull request merge commit (tools/ci_scope.py)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Fuzz smoke, one shard (make go-check-fuzz GO_FUZZ_SHARD)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
          SHARD: ${{ matrix.shard }}
        run: python -B tools/go_ci.py go --part fuzz --shard "$SHARD" --docs-only-fast-path --summary "$GITHUB_STEP_SUMMARY"

  go-parity:
    # The parity gates of `make go-check` (`make go-check-parity`): parity-go (every committed fixture
    # replayed through the Go engine and compared with the Python reference's frozen answers, with a floor
    # under the parity report), parity-analyze, parity-decrypt, parity-live, parity-live-decrypt, schema-go,
    # parity-control, parity-server, adversarial, parity-random and bench-gate. Since PRO-401 every one of
    # them replays a golden file (migration/fixtures/golden/, migration/parity/golden.py): no Python
    # reference runs and nothing beyond the standard library is installed. The job keeps its name, which
    # branch protection matches.
    name: Go parity with the Python reference (replay, analyze, decrypt, live, schema, random, bench)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # both parents of the pull request merge commit (tools/ci_scope.py)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Parity gates (make go-check-parity) and parity report floor
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py go --part parity --docs-only-fast-path --summary "$GITHUB_STEP_SUMMARY"

  go-minimum:
    # The Go engine on the oldest Go it declares it supports: go/go.mod's `go` line (the minimum,
    # go.dev/doc/toolchain), installed explicitly by setup-go, as go-engine installs the compiler.
    # `make go-check-minimum` is go vet and go test -race. tools/go_ci.py reads the release from
    # go/go.mod (digits and dots only) and refuses an inexact minimum, a minimum above the toolchain,
    # or any other installed Go; GOPROXY=off keeps the job on that one Go. With no minimum below
    # the compiler, go-engine's run is the minimum run and this job says so.
    name: Go engine on its declared minimum Go (vet, race tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # both parents of the pull request merge commit (tools/ci_scope.py)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read the declared minimum Go
        id: minimum
        run: python -B tools/go_ci.py minimum-version --github-output "$GITHUB_OUTPUT"
      - name: Set up the declared minimum Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.minimum.outputs.version }}
          cache: false
      - name: Go engine on its minimum (make go-check-minimum)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py minimum --docs-only-fast-path --summary "$GITHUB_STEP_SUMMARY"

  go-vendor:
    # The vendored Go modules match go.mod and go.sum (`make go-vendor-check` re-vendors into build/
    # and compares). It is the one Go target with module access: the module proxy and the checksum
    # database, written out, nothing private or insecure; every other Go job runs with GOPROXY=off
    # on the committed vendor tree. Nothing to verify without dependencies (main today).
    name: Go vendor tree matches go.mod and go.sum (module proxy, checksum database)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Re-vendor and compare (make go-vendor-check)
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py vendor-check --summary "$GITHUB_STEP_SUMMARY"

  go-lint:
    # Lint and static analysis of the Go engine (go/): golangci-lint 2.15.0 (tools/golint/golangci.yml),
    # staticcheck 2026.2.2 and gosec 2.29.0 (G104 and G304 excluded, reasons in tools/go_lint.py), each built
    # from tools/golint/<tool>/go.mod and go.sum (every module hash checked against the Go checksum database)
    # in a copy outside the checkout, before any repository code runs. They then run on the vendored tree with
    # no module download. A finding beyond tools/golint/baseline.json fails the job, and so does a tool that
    # cannot load the tree (gosec's silent all-clear on an export-data mismatch included).
    name: Go lint and static analysis (golangci-lint, staticcheck, gosec)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the pinned golangci-lint, staticcheck and gosec (tools/golint)
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/golint"
          cp -r tools/golint/golangci-lint tools/golint/staticcheck tools/golint/gosec "$RUNNER_TEMP/golint/"
          cd "$RUNNER_TEMP/golint/golangci-lint"
          GOBIN="$RUNNER_TEMP/bin" go install tool
          cd "$RUNNER_TEMP/golint/staticcheck"
          GOBIN="$RUNNER_TEMP/bin" go install tool
          cd "$RUNNER_TEMP/golint/gosec"
          GOBIN="$RUNNER_TEMP/bin" go install tool
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Lint the engine against the baseline (tools/go_lint.py)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          python -B tools/go_lint.py --self-test
          python -B tools/go_lint.py --bin "$RUNNER_TEMP/bin" --summary "$GITHUB_STEP_SUMMARY"

  go-determinism:
    # Culvert's pr-deep-gate determinism rerun: every Go test twice, in a random order per run, with the race
    # detector (`go test -race -shuffle=on -count=2 ./...`, tools/go_deep.py), on the vendored tree with no
    # module download. An order-dependent, state-leaking or flaky test fails; the summary names the shuffle
    # seed that reproduces it.
    name: Go determinism (race detector, shuffled order, every test twice)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # both parents of the pull request merge commit (tools/ci_scope.py)
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: go test -race -shuffle=on -count=2 (tools/go_deep.py)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          python -B tools/go_deep.py --self-test
          python -B tools/go_deep.py determinism --docs-only-fast-path --summary "$GITHUB_STEP_SUMMARY"

  go-licenses:
    # Culvert's pr-deep-gate licence blocking: go-licenses 2.0.1, built from tools/golint/go-licenses/go.mod and
    # go.sum (every module hash checked against the Go checksum database) in a copy outside the checkout before
    # any repository code runs, checks every module the engine links; a forbidden, restricted or unidentified
    # licence fails (tools/go_deep.py). The vendored golang.org/x/crypto and golang.org/x/sys are BSD-3-Clause.
    name: Go dependency licences (go-licenses; forbidden, restricted, unknown fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the pinned go-licenses (tools/golint/go-licenses)
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/golint"
          cp -r tools/golint/go-licenses "$RUNNER_TEMP/golint/"
          cd "$RUNNER_TEMP/golint/go-licenses"
          GOBIN="$RUNNER_TEMP/bin" go install tool
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the engine's dependency licences (tools/go_deep.py)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          python -B tools/go_deep.py --self-test
          python -B tools/go_deep.py licenses --bin "$RUNNER_TEMP/bin" --summary "$GITHUB_STEP_SUMMARY"

  go-coverage:
    # Culvert's coverage floors (coverage-floor.sh): `go test -coverpkg=./... -coverprofile` over the Go engine
    # on the vendored tree with no module download, reduced by tools/go_cover.py to a module total and a total
    # per package. The module total and every parser package (internal/protocols/*) must stay at or above its
    # floor in tools/golint/coverage-floors.json (measured minus 1.0 point; lowering one is a reviewed change).
    name: Go coverage floors (module and every protocol parser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Measure coverage and hold the floors (tools/go_cover.py)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          python -B tools/go_cover.py --self-test
          python -B tools/go_cover.py --summary "$GITHUB_STEP_SUMMARY"

  go-api:
    # API compatibility of the Go engine module (tools/go_api.py): apidiff, built from tools/golint/apidiff/go.mod
    # and go.sum outside the checkout before any repository code runs, compares the module's API at the base
    # (a pull request's base, a push's first parent) with this commit, on the vendored trees with no module
    # download. An incompatible change to a public (importable, non-main) package fails unless the pull request
    # carries the `api-break` label; changes to internal packages are reported only. Today every engine package
    # is internal or main, so the gate holds the line for the first package made public.
    name: Go API compatibility (apidiff; public breaks need the api-break label)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the pinned apidiff (tools/golint/apidiff)
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/golint"
          cp -r tools/golint/apidiff "$RUNNER_TEMP/golint/"
          cd "$RUNNER_TEMP/golint/apidiff"
          GOBIN="$RUNNER_TEMP/bin" go install tool
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compare the module API with the base (tools/go_api.py)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python -B tools/go_api.py --self-test
          python -B tools/go_api.py --bin "$RUNNER_TEMP/bin" --summary "$GITHUB_STEP_SUMMARY"

  go-bench:
    # Performance regression gate of the Go engine (tools/go_bench.py, PRO-268): benchstat, built from
    # tools/golint/benchstat/go.mod and go.sum outside the checkout before any repository code runs, compares
    # every existing Go benchmark at the pull request's head with its merge base (a push's first parent), 6
    # interleaved rounds per side on the vendored trees with no module download. A hot-path benchmark (per-flow
    # inspect over TLS, HTTP, SSH and unknown flows, whole and byte by byte; QUIC datagram assembly) fails when
    # sec/op is more than 10 % slower with p < 0.05 or allocs/op grows (SSDLC.md item 44). The tool measures only
    # when go/, itself or its benchstat module changed; otherwise it reports that and passes.
