        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the pinned benchstat (tools/golint/benchstat)
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/golint"
          cp -r tools/golint/benchstat "$RUNNER_TEMP/golint/"
          cd "$RUNNER_TEMP/golint/benchstat"
          GOBIN="$RUNNER_TEMP/bin" go install tool
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compare the benchmarks with the merge base (tools/go_bench.py)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -B tools/go_bench.py --self-test
          python -B tools/go_bench.py --bin "$RUNNER_TEMP/bin" --summary "$GITHUB_STEP_SUMMARY"

  contract-compat:
    # The product's external contract (tools/contract_check.py): schemas/*.schema.json with every $ref resolved,
    # and the protodetect CLI as its own help output reports it (both binaries built vendored and offline),
    # compared at the base (a pull request's base, a push's first parent) with this commit. A breaking change
    # (a field removed or newly required, a type, enum, const, bound or oneOf branch changed, a schema file
    # removed, a subcommand or flag removed, a flag's type or default changed) fails unless the pull request
    # carries the `api-break` label, like go-api; additions are reported only.
    name: External contract compatibility (JSON schemas, protodetect CLI; breaks need the api-break label)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compare the schemas and the CLI with the base (tools/contract_check.py)
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python -B tools/contract_check.py --self-test
          python -B tools/contract_check.py --summary "$GITHUB_STEP_SUMMARY"

  content-pack:
    # A content release (a research batch) must hold together: the schema, the lock and every
    # earlier release reproducing its published digest (`make content`), the exported pack and
    # history (`make content-pack`), the Go copy identical to the export, no duplicate or
    # conflicting application, alias, host or web-front id, and the Go backend recomputing the
    # same digests (`go test ./internal/content/...`). tools/content_gate.py; on a commit without
    # the Go content pack it says there is nothing to check and passes.
    name: content pack (lock, release history, ids, Python/Go parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Content-pack gate
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/content_gate.py --summary "$GITHUB_STEP_SUMMARY"

  security-requirements:
    name: security requirements gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the Go binary the referenced Python tests run (offline and vendored)
        # PRO-546 (SEC-PYRM-2): --run now runs the referenced Python tests strictly, and SR-63 and SR-67 drive
        # go/bin/protodetect; without it they skip or error, which fails the gate instead of passing silently.
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_ci.py build --summary "$GITHUB_STEP_SUMMARY"
      - name: Every security requirement names tests that exist and pass when run (none skipped)
        # PRO-403: the requirements are verified by the Go engine's tests; --run runs each referenced test with
        # the pinned Go, offline and vendored, and fails unless every one reports PASS. PRO-546: the referenced
        # Python test methods (test_*::test_*) run too, and a skip, failure, error or missing method fails.
        env:
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          python -B tools/check_security_requirements.py --self-test
          python -B tools/check_security_requirements.py --run | tee -a "$GITHUB_STEP_SUMMARY"

  ledgers:
    # PRO-347: the shared ledger sections (lane briefs, STATUS.md recent work, README/REVIEW-SCOPE test counts) are
    # generated from migration/notes/PRO-<n>.md by tools/build_ledgers.py. A pull request adds its own notes file and
    # never edits a generated section, so the check lets its own note lag and fails on a hand edit, a malformed note
    # or a broken marker, printing the command that rebuilds them. The strict check runs in the nightly ledgers
    # workflow and the release gate. Needs no history and no test run.
    name: ledgers (generated sections not hand-edited, notes well-formed)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The generated ledger sections and the notes files
        run: |
          python -B tools/build_ledgers.py --self-test
          python -B tools/build_ledgers.py --check --summary "$GITHUB_STEP_SUMMARY"

  gate:
    # Branch protection needs one required check: this job fails when any job in `needs` failed, was
    # cancelled or was skipped. `needs` must list every other ci job; tools/check_workflow_policy.py
    # (workflow-lint job, make check) fails when a job is missing from it or a listed job is gone.
    name: ci gate (all jobs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [verify, presentation-ui, static-analysis, supply-chain, workflow-lint, toolchain-audit, osv-scan, go-engine, go-fuzz-smoke, go-parity, go-minimum, go-vendor, go-lint, go-determinism, go-licenses, go-coverage, go-api, go-bench, contract-compat, content-pack, security-requirements, ledgers]
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Every ci job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee gate.txt
          {
            echo "### ci gate"
            echo
            echo '```'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
