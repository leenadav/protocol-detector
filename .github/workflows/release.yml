# Release gate: a tag builds the sdist/wheel, attaches a CycloneDX SBOM and a
# SLSA-style build provenance attestation, and publishes a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Harden runner egress
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: The full gate must pass on the tagged commit
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -B -m compileall -q protocol_engine tools ./*.py
          python -B -m unittest discover -q
          ruff check .
          python -B tools/check_action_pins.py .github/workflows
          python -B tools/check_security_requirements.py
          python -B tools/check_docs_counts.py
          python -B tools/coverage_matrix.py --check PROTOCOLS.md
          python -B protodetect.py policy lint policy-example.json --strict
      - name: The tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -B protodetect.py version | awk '{print $NF}')
          test "v${VERSION}" = "${TAG}" || (echo "tag ${TAG} does not match version ${VERSION}" && exit 1)
      - name: Build distributions and SBOM
        run: |
          python -m build --sdist --wheel --outdir dist
          python -B tools/check_wheel.py "dist/*.whl"
          cyclonedx-py environment --output-format json --output-file dist/sbom.cdx.json
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
