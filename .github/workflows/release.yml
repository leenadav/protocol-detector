# Release gate: a tag builds the sdist/wheel, attaches a CycloneDX SBOM and a
# SLSA-style build provenance attestation, and publishes a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # a release in flight is never cancelled; a second tag queues behind it

jobs:
  build:
    name: release build (gate, version check, distributions, attestation, publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # gh release create uploads the distributions to the release
      id-token: write       # OIDC token for the Sigstore signing of the provenance attestation
      attestations: write   # attest-build-provenance stores the attestation on the repository
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: The full gate must pass on the tagged commit
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -B -m compileall -q protocol_engine tools ./*.py
          python -B -m unittest discover -q
          ruff check .
          python -B tools/check_action_pins.py .github/workflows
          python -B tools/check_security_requirements.py
          python -B tools/check_docs_counts.py
          python -B tools/coverage_matrix.py --check PROTOCOLS.md
          python -B protodetect.py policy lint policy-example.json --strict
      - name: The tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -B protodetect.py version | awk '{print $NF}')
          test "v${VERSION}" = "${TAG}" || (echo "tag ${TAG} does not match version ${VERSION}" && exit 1)
      - name: Build distributions and SBOM
        run: |
          python -m build --sdist --wheel --outdir dist
          python -B tools/check_wheel.py "dist/*.whl"
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --no-deps --no-index dist/*.whl
          (cd /tmp && /tmp/wheel-env/bin/python "$GITHUB_WORKSPACE/tools/wheel_smoke.py")
          cyclonedx-py environment --output-format json --output-file dist/sbom.cdx.json
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - name: Publish the release with the runner's gh CLI (no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/*
