# Release gate: a tag builds the sdist/wheel, attaches a CycloneDX SBOM and a
# SLSA-style build provenance attestation, and publishes a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tests must pass on the tagged commit
        run: python -B -m unittest discover -q
      - name: Build distributions and SBOM
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m build --sdist --wheel --outdir dist
          cyclonedx-py environment --output-format json --output-file dist/sbom.cdx.json
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - name: Publish release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*
          generate_release_notes: true
