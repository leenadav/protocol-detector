# Weekly OpenSSF Scorecard: the repository's supply-chain posture (pinned dependencies, token
# permissions, dangerous workflow patterns, branch protection, code review, SAST, fuzzing, and
# more), uploaded as SARIF to code scanning and kept as an artifact. publish_results stays false:
# publishing to the public Scorecard API needs `id-token: write` and a workflow with no top-level
# `defaults:`, which the workflow policy (rules 5 and 6) forbids outside the release controller.
# See SSDLC.md item 42.
name: scorecard

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analysis:
    name: OpenSSF Scorecard (weekly, SARIF to code scanning)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload-sarif writes the results to code scanning (no-op until enabled)
      actions: read            # Scorecard reads workflow runs for the CI-Tests and Dangerous-Workflow checks
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard (results stay private to this repository)
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif-${{ github.sha }}
          path: scorecard-results.sarif
          retention-days: 30
      - name: Upload to code scanning (requires the feature to be enabled)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
