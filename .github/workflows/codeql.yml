name: codeql

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (python, security-extended)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload-sarif writes the results to code scanning (no-op until enabled)
      actions: read            # codeql-action reads the workflow run to attach its analysis status
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          queries: security-extended,security-and-quality
      # Analysis always runs and fails the job on real errors. Results are kept as an
      # artifact; the upload to the Security tab needs "Code scanning" enabled in the
      # repository settings (Settings -> Code security), so it may not fail the gate.
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:python"
          upload: never
          output: codeql-results
      - name: Fail on error-level CodeQL findings (summary table of packs, rules and findings)
        run: python3 -B tools/codeql_gate.py codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results
          retention-days: 30
      - name: Upload to code scanning (requires the feature to be enabled)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: codeql-results
          category: "/language:python"
