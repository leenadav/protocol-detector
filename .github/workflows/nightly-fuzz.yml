# Extended seeded fuzzing beyond the unit-test budget. Findings are regressions in
# bounded parsing (crash, unbounded work, status outside the documented set).
name: nightly-fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: mutations per fixture
        default: "20000"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Mutation fuzz every stream and datagram fixture
        run: python -B tools/fuzz_fixtures.py --iterations ${{ github.event.inputs.iterations || '20000' }} --seed ${{ github.run_id }}
