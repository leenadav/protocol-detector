# Extended seeded fuzzing beyond the unit-test budget. Findings are regressions in
# bounded parsing (crash, unbounded work, status outside the documented set).
# Three jobs: the Python mutation fuzz of every fixture; every Go fuzz target for minutes
# instead of the per-push gate's seconds (tools/go_fuzz_long.py; failing inputs are uploaded);
# and the randomized Python-vs-Go parity run (make parity-random-long, PRO-100/PRO-136: the
# Python reference as oracle; the report of a failing run, with every mismatched case, is uploaded).
# None of them is a required check, so a nightly failure never blocks a pull request.
# GitHub runs `schedule` only from the default branch's copy of this file, so a change here
# takes effect nightly once it is on main; before that, run it with workflow_dispatch on
# the branch (the file already exists on main, so dispatch can target any ref).
name: nightly-fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: mutations per fixture
        default: "20000"
      go_budget:
        description: minutes of Go fuzzing, split across every fuzz target (1-100)
        default: "80"
      random_seed:
        description: seed of the randomized Python-vs-Go parity run (digits; empty means this run's id)
        default: ""
      random_count:
        description: cases in the randomized parity run (1-500000)
        default: "50000"

permissions:
  contents: read

concurrency:
  group: nightly-fuzz-${{ github.ref }}
  cancel-in-progress: false   # a manual run never cancels the scheduled one; they queue

# Explicit bash runs `bash --noprofile --norc -eo pipefail`; the unspecified default is
# `bash -e` without pipefail, under which a failing check piped into tee passes the step.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: extended mutation fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Mutation fuzz every stream and datagram fixture
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '20000' }}
          SEED: ${{ github.run_id }}
        run: |
          python -B tools/fuzz_fixtures.py --iterations "$ITERATIONS" --seed "$SEED" | tee fuzz.txt
          {
            echo "### Nightly fuzz (seed $SEED, $ITERATIONS mutations per fixture)"
            echo
            echo '```'
            tail -n 5 fuzz.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the fuzz log (seed and failing fixture)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-fuzz-log
          path: fuzz.txt
          if-no-files-found: ignore
          retention-days: 14

  go-fuzz:
    name: extended Go fuzz (every fuzz target)
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Fuzz every Go fuzz target
        # The ci Go jobs' environment: no download of any module or toolchain (dependencies are
        # vendored, go_ci.go_env sets -mod=vendor then), on exactly the pinned compiler.
        env:
          BUDGET: ${{ github.event.inputs.go_budget || '80' }}
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: python -B tools/go_fuzz_long.py --budget-minutes "$BUDGET" --summary "$GITHUB_STEP_SUMMARY" --out go-fuzz-crashers
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fuzz-crashers
          path: go-fuzz-crashers/
          if-no-files-found: ignore
          retention-days: 14

  parity-random:
    # make parity-random-long (migration/parity/random_diff.py): valid-shaped TLS ClientHello, HTTP, SSH and QUIC
    # Initial cases, varied by fragmentation, truncation, hints and budgets, answered by the Python reference and
    # by the Go binary (`protodetect replay`); any mismatch outside migration/parity/random_allow.json fails. The
    # seed is this run's id (or the dispatch input) and is written to the summary: the same seed and count
    # reproduce the run exactly (make parity-random-long SEED=<seed> COUNT=<count>).
    name: randomized Python-vs-Go parity (long)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up the pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Randomized parity, the Python reference as oracle
        # The ci Go jobs' environment: no module or toolchain download (vendored tree, pinned compiler).
        # The dispatch inputs reach make only after they are checked to be plain decimal numbers.
        env:
          SEED: ${{ github.event.inputs.random_seed || github.run_id }}
          COUNT: ${{ github.event.inputs.random_count || '50000' }}
          GOPROXY: "off"
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          [[ "$SEED" =~ ^[0-9]{1,20}$ ]] || { echo "seed must be digits, got: $SEED"; exit 2; }
          [[ "$COUNT" =~ ^[0-9]{1,6}$ ]] && (( COUNT >= 1 && COUNT <= 500000 )) || { echo "count must be 1-500000, got: $COUNT"; exit 2; }
          echo "### Randomized Python-vs-Go parity (seed $SEED, $COUNT cases)" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce: \`make parity-random-long SEED=$SEED COUNT=$COUNT\`" >> "$GITHUB_STEP_SUMMARY"
          make parity-random-long SEED="$SEED" COUNT="$COUNT" PYTHON=python 2>&1 | tee parity-random.txt
          {
            echo
            echo '```'
            tail -n 8 parity-random.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the mismatch report (seed, failing cases, both answers)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-random-report
          path: |
            build/random-diff-*.json
            parity-random.txt
          if-no-files-found: ignore
          retention-days: 14
