# Extended seeded fuzzing beyond the unit-test budget. Findings are regressions in
# bounded parsing (crash, unbounded work, status outside the documented set).
name: nightly-fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: mutations per fixture
        default: "20000"

permissions:
  contents: read

concurrency:
  group: nightly-fuzz-${{ github.ref }}
  cancel-in-progress: false   # a manual run never cancels the scheduled one; they queue

# Explicit bash runs `bash --noprofile --norc -eo pipefail`; the unspecified default is
# `bash -e` without pipefail, under which a failing check piped into tee passes the step.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: extended mutation fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Mutation fuzz every stream and datagram fixture
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '20000' }}
          SEED: ${{ github.run_id }}
        run: |
          python -B tools/fuzz_fixtures.py --iterations "$ITERATIONS" --seed "$SEED" | tee fuzz.txt
          {
            echo "### Nightly fuzz (seed $SEED, $ITERATIONS mutations per fixture)"
            echo
            echo '```'
            tail -n 5 fuzz.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
