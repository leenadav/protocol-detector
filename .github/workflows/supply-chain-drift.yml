# Weekly supply-chain drift gate: the pinned action SHAs must still be the commits their
# tag comments name, the checksum-verified tool downloads must still resolve, and every
# hash in requirements-dev.txt must still match what the index serves, and the Go that builds
# the pinned scanners must be a supported line on its newest patch. A failure here
# means a tag moved, a release disappeared or an index artifact changed: a review item,
# never something to fix by re-pinning blindly. See SSDLC.md.
name: supply-chain-drift

on:
  schedule:
    - cron: "29 5 * * 2"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"   # every workflow holds pinned actions; tools/check_workflow_policy.py enforces this
      - "tools/check_pin_drift.py"
      - "requirements-dev.txt"
      - "tools/check_go_drift.py"
      - "tools/scanners/go.mod"
  pull_request:
    paths:
      - ".github/workflows/**"   # every workflow holds pinned actions; tools/check_workflow_policy.py enforces this
      - "tools/check_pin_drift.py"
      - "requirements-dev.txt"
      - "tools/check_go_drift.py"
      - "tools/scanners/go.mod"

permissions:
  contents: read

concurrency:
  group: drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Explicit bash runs `bash --noprofile --norc -eo pipefail`; the unspecified default is
# `bash -e` without pipefail, under which a failing check piped into tee passes the step.
defaults:
  run:
    shell: bash

jobs:
  action-pin-drift:
    name: pinned action SHAs still match their tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Every action must be pinned to a commit SHA (same gate as ci)
        run: python -B tools/check_action_pins.py .github/workflows
      - name: The checker's offline self-test
        run: python -B tools/check_pin_drift.py --self-test
      - name: Resolve every tag comment against its repository and compare with the pinned SHA
        run: |
          python -B tools/check_pin_drift.py .github/workflows | tee pin-drift.txt
          {
            echo "### Action pin drift"
            echo
            echo '```'
            cat pin-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tool-checksums:
    name: tool downloads and dev-dependency hashes still resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: The actionlint release ci.yml names must still match the SHA-256 ci.yml verifies
        # The version and checksum are read from ci.yml itself, so this job always checks the
        # values the workflow-lint job will use rather than a second copy of them.
        run: |
          VERSION=$(grep -m1 -oE 'VERSION: "[0-9.]+"' .github/workflows/ci.yml | grep -oE '[0-9.]+')
          SHA256=$(grep -m1 -oE 'SHA256: "[0-9a-f]{64}"' .github/workflows/ci.yml | grep -oE '[0-9a-f]{64}')
          test -n "$VERSION" && test -n "$SHA256"
          echo "actionlint ${VERSION} expected sha256 ${SHA256}"
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c - | tee -a "$GITHUB_STEP_SUMMARY"
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -version
      - name: Every hash-pinned development dependency must still download and match its hash
        run: |
          python -m pip download --require-hashes --no-deps -r requirements-dev.txt -d downloads > download.log
          COUNT=$(find downloads -type f | wc -l)
          echo "downloaded and hash-verified ${COUNT} distributions from requirements-dev.txt"
          {
            echo "### Development dependency hashes"
            echo
            echo "${COUNT} distributions downloaded with \`--require-hashes\`; every hash matched."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The pinned pip-audit still installs and runs from the verified downloads alone
        run: |
          python -m venv audit-env
          audit-env/bin/python -m pip install --require-hashes --no-index --find-links downloads -r requirements-dev.txt > /dev/null
          audit-env/bin/pip-audit --version | tee -a "$GITHUB_STEP_SUMMARY"

  go-toolchain-drift:
    name: the Go that builds the pinned scanners is supported and on its newest patch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: The checker's offline self-test
        run: python -B tools/check_go_drift.py --self-test
      - name: The setup-go version is one Go release, a supported line, on its newest patch
        # Read from the Go module proxy's toolchain list; govulncheck in ci covers known
        # vulnerabilities, this covers a release line or patch level that has fallen behind.
        run: python -B tools/check_go_drift.py | tee -a "$GITHUB_STEP_SUMMARY"
