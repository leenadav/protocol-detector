# Nightly secret scan of every branch (PRO-539). A pull request's ci run scans only the history its
# merge commit reaches (--log-opts=HEAD in ci.yml's static-analysis job), so that a leak on one lane's
# branch no longer fails every other pull request; this run keeps the coverage of every other branch:
# gitleaks 8.30.1, built exactly as in ci.yml, reads every commit of every branch fetched
# (fetch-depth: 0 fetches all of refs/heads, and --log-opts=--all walks them), with inline allows
# ignored and .gitleaks.toml as the only allowlist. A finding fails the run, and the step summary
# names the scope, the redacted findings and the next step. It is not a required check, so a
# nightly finding never blocks a pull request; the red scheduled run is the report.
# Rule 15 pins this job whole (tools/check_workflow_policy.py, SECRET_SCAN_STEPS) and
# tools/check_gitleaks_allowlist.py checks the scope and proves it with the real gitleaks.
# GitHub runs `schedule` only from the default branch's copy of this file, so it takes effect
# nightly once it is on main; before that, run it with workflow_dispatch on the branch.
name: secret-scan

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false   # a manual run never cancels the scheduled one; they queue

# Explicit bash runs `bash --noprofile --norc -eo pipefail`; the unspecified default is
# `bash -e` without pipefail, under which a failing scan piped into tee passes the step.
defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: secret scan of every branch (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go for the pinned scanner build
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Secret scan of every branch (gitleaks 8.30.1, --log-opts=--all, inline allows ignored)
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly"
          GOWORK: "off"
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
        run: |
          mkdir -p "$RUNNER_TEMP/scanners"
          cp tools/scanners/go.mod tools/scanners/go.sum "$RUNNER_TEMP/scanners/"
          cd "$RUNNER_TEMP/scanners"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8
          cd "$GITHUB_WORKSPACE"
          echo "### Nightly secret scan: every branch (gitleaks --log-opts=--all, $(git branch -r | wc -l) remote refs)" | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/bin/gitleaks" git --log-opts=--all --ignore-gitleaks-allow --redact --no-banner --exit-code 1 . 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "secret scan: ok, no leak on any branch" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report a finding in the summary
        if: failure()
        run: |
          {
            echo
            echo "**secret scan: FAILED.** gitleaks reported a leak on at least one branch (redacted above, with its"
            echo "commit and file). Pull requests are not blocked: each scans only its own history. Report it on the board"
            echo "to the branch's lane; the secret is rotated and the branch fixed, never allowlisted to get green."
          } >> "$GITHUB_STEP_SUMMARY"
