version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # a new release waits a week before an update PR proposes it (zizmor dependabot-cooldown)
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Rule 7 of tools/check_workflow_policy.py keeps upload-artifact and download-artifact (the
      # release handoff) on one major version. download-artifact v8 shipped before any upload-artifact
      # v8, so a grouped PR that moves only the download side fails workflow-lint (PR #23). Remove this
      # entry, and bump both together, once actions/upload-artifact publishes v8.
      - dependency-name: actions/download-artifact
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # a new release waits a week before an update PR proposes it (zizmor dependabot-cooldown)
    commit-message:
      prefix: "ci(deps)"
    groups:
      dev-tools:
        patterns: ["*"]
    # requirements-dev.txt is the only pip input; the package has no runtime dependencies.
    # presentation/requirements-decryption.lock.txt is deliberately not managed here: it is a uv universal
    # lock with per-interpreter environment markers (Python 3.9 pins included), which Dependabot's pip
    # updater would rewrite as single pins. Regenerate it with the command in its header (engine lane).
  - package-ecosystem: gomod
    directory: /tools/scanners
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # a new release waits a week before an update PR proposes it (zizmor dependabot-cooldown)
    commit-message:
      prefix: "ci(deps)"
    groups:
      scanners:
        patterns: ["*"]
    # gitleaks, govulncheck and their dependencies (items 21-22). Rule 16 locks go.mod, so each
    # update PR also advances tools/scanner_config.lock.json (--write-scanner-lock) as its
    # reviewed baseline step; govulncheck in ci decides whether the result is safe.
  - package-ecosystem: npm
    directory: /tools/ui-test-deps
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # a new release waits a week before an update PR proposes it (zizmor dependabot-cooldown)
    commit-message:
      prefix: "ci(deps)"
    groups:
      ui-test-tools:
        patterns: ["*"]
    # The Playwright the presentation-ui ci job installs with npm ci (item 25); CI-only, never shipped.
