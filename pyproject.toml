[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-stream-engine"
version = "0.65.0"
description = "Bounded incremental protocol classification for TCP streams and UDP datagrams"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# The presentation application's TLS POC decrypts records with cryptography's AEADs; the core needs nothing.
decryption = ["cryptography==50.0.2"]

[tool.setuptools]
packages = ["protocol_engine", "protocol_adapters"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
# Correctness and security rules only; style is not a CI gate.
select = ["E9", "F", "B", "S", "PLE", "W605"]
ignore = [
  "B011",  # assert False in tests is deliberate
  "S101",  # asserts are test code
  "S311",  # random is used for seeded fuzzing, never for secrets
  "B904",  # explicit `raise ... from None` is used where chaining would leak
  "B905",  # zip(strict=) is Python 3.10+
  "B007",  # historical benchmark scripts keep their loop variables
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S", "B"]
"live_capture.py" = ["S603", "S404", "S607"]   # argv-only subprocess with resolved executable, reviewed
"tools/compare_engine.py" = ["S603"]        # sys.executable with argv-only arguments, reviewed
"tools/build_manifest.py" = ["S603", "S607"]  # fixed argv `git rev-parse` for manifest provenance only
"live_smoke.py" = ["S603", "S404", "S607", "S104"]
"*interop*.py" = ["S603", "S404", "S607"]
"benchmark*.py" = ["S603", "S404", "S607"]
"ike_decoder_check.py" = ["S603", "S404", "S607"]
# Presentation application (stage 1a): argv-only subprocess calls, no shell. The workers run sys.executable on the
# app's own scripts; tcpdump comes from live_capture.capture_command, which validates interface and filter.
"presentation/server.py" = ["S603"]
"presentation/live_manager.py" = ["S603"]
"presentation/poc_decryption/live.py" = ["S603"]
"presentation/launch.py" = ["S603", "S310"]   # S310: urlopen only of http://127.0.0.1:<port> built in main()
